name: Build LarpOS ISO

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Required for softprops/action-gh-release: since Feb 2023 GITHUB_TOKEN
# defaults to read-only, and creating a Release needs contents:write.
# Without this the release step fails with 403 "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    name: Build LarpOS (Blood Moon) ISO
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af || true
          df -h / /mnt

      - name: Build ISO inside Arch Linux container
        run: |
          sudo mkdir -p /mnt/larpos-work /mnt/larpos-out
          sudo docker run --rm --privileged \
            -v /mnt/larpos-work:/work \
            -v /mnt/larpos-out:/out \
            -v "$GITHUB_WORKSPACE:/build" \
            archlinux:base-devel \
            pacman-key --init
            bash -e -c 'pacman -Syu --noconfirm archiso curl zstd && KEY=882DCFE48E2051D48E2562ABF3B607488DB35A47 && (pacman-key --recv-keys $KEY --keyserver hkps://keyserver.ubuntu.com:443 && pacman-key --lsign-key $KEY || (curl -fsSL -o /tmp/ck.pkg.tar.zst https://build.cachyos.org/cachyos-keyring-2-1-any.pkg.tar.zst && tar --zstd -xf /tmp/ck.pkg.tar.zst -C /tmp && pacman-key --add /tmp/usr/share/pacman/keyrings/cachyos.gpg && pacman-key --lsign-key $KEY)) && mkarchiso -v -w /work -o /out /build/profile'

      - name: Collect results and checksums
        run: |
          mkdir -p out
          sudo cp /mnt/larpos-out/* out/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" out
          ISO=$(ls out/*.iso | head -n1)
          echo "### LarpOS build result" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh out/ >> "$GITHUB_STEP_SUMMARY"
          sha256sum out/*.iso | tee out/SHA256SUMS
          sha256sum out/*.iso >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h "$ISO" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build checksums (non-release builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: larpos-build-info
          path: out/SHA256SUMS
          if-no-files-found: error

      - name: Prepare release files (split ISO if larger than 1900 MiB)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          ISO=$(ls out/*.iso | head -n1)
          SIZE_MB=$(du -m "$ISO" | cut -f1)
          if [ "$SIZE_MB" -le 1900 ]; then
            echo "FILES_PATHS=out/*.iso,out/SHA256SUMS" >> "$GITHUB_ENV"
          else
            BASE=$(basename "$ISO")
            cd out
            split -b 1900M -d "$BASE" "$BASE.part-"
            cd ..
            echo "FILES_PATHS=out/${BASE}.part-*,out/SHA256SUMS" >> "$GITHUB_ENV"
            echo "ISO is ${SIZE_MB} MiB - released as parts. Reassemble:" >> "$GITHUB_STEP_SUMMARY"
            echo "\`cat ${BASE}.part-* > ${BASE}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create GitHub Release with the ISO
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: LarpOS ${{ github.ref_name }} (Blood Moon)
          body: |
            **LarpOS Linux Edition - Blood Moon** (Arch Linux based, Hyprland Edition)

            Download `*.iso` (or all `.part-*` chunks and reassemble with
            `cat larpos-*.iso.part-* > larpos-*.iso`), verify with `SHA256SUMS`,
            then write the ISO to USB with Rufus (DD mode), Ventoy or `dd`.

            Boot, log in automatically as `liveuser` (Hyprland + Waybar),
            run **Install LarpOS** from the app launcher (Super+D) to install.

            *LarpOS is not affiliated with or endorsed by Arch Linux.*
          files: ${{ env.FILES_PATHS }}
          fail_on_unmatched_files: true
