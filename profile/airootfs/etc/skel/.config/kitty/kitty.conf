# LarpOS Blood Moon terminal
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.0
cursor_shape     beam
cursor_blink_interval 0.6

scrollback_lines 5000
enable_audio_bell no
tab_bar_style    powerline
tab_powerline_style slanted
window_padding_width 8
background_opacity 0.92
remember_window_size no
initial_window_width  110c
initial_window_height 30c

# Blood Moon palette
foreground   #e8e6e3
background   #0d0d12
selection_foreground #ffffff
selection_background #5a1a1a
cursor       #e0342f
url_color    #ff7a45

color0  #1a1a22
color1  #e0342f
color2  #8fbf6f
color3  #ffb347
color4  #6a9bd8
color5  #d16a9e
color6  #5fb3a1
color7  #c9c7c2
color8  #55555f
color9  #ff5c55
color10 #a8d98a
color11 #ffd28a
color12 #8ab8f0
color13 #ef8abc
color14 #7fd4c4
color15 #f2f1ee
