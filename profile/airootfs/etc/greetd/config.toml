# LarpOS greetd configuration
# - Live session: greetd auto-logs in as liveuser straight into Hyprland.
# - Installed system: Calamares removes the [initial_session] block,
#   so users get the tuigreet login prompt instead.

[terminal]
vt = 1

[default_session]
command = "tuigreet --time --remember --remember-session --cmd Hyprland"
user = "greeter"

[initial_session]
command = "Hyprland"
user = "liveuser"
