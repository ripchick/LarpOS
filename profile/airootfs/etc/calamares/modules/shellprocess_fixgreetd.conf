# Turn live autologin off on the installed system:
# drop [initial_session] from greetd config and the tty2 live autologin.
dontChroot: false
timeout: 30
script:
    - "sed -i '/^\\[initial_session\\]/,+3d' /etc/greetd/config.toml"
    - "rm -f /etc/systemd/system/getty@tty2.service.d/autologin.conf"
