# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Use graphics-mode output
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output console
    # Blood Moon theme (optional, silently skipped if missing)
    if [ -f "/boot/grub/themes/larpblood/theme.txt" ]; then
        insmod png
        set theme=($root)/boot/grub/themes/larpblood/theme.txt
    fi
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    larpos_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    larpos_platform='BIOS'
else
    larpos_platform="${grub_cpu}-${grub_platform}"
fi

# Set default menu entry
default=larpos
timeout=10
timeout_style=menu


# Menu entries

menuentry "LarpOS Live (Arch-based, %ARCH%, ${larpos_platform})" --class larpos --class gnu-linux --class gnu --class os --id 'larpos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "LarpOS Live (safe graphics, nomodeset)" --class larpos --class gnu-linux --class gnu --class os --id 'larpos-nomodeset' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}


if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
