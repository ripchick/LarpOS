LABEL larpos
TEXT HELP
Boot LarpOS Live (Arch Linux based) on BIOS.
KDE Plasma desktop with the Blood Moon theme.
ENDTEXT
MENU LABEL LarpOS Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Safe graphics boot option
LABEL larposnomodeset
TEXT HELP
Boot LarpOS Live without kernel mode setting.
Use if the display stays black on the default entry.
ENDTEXT
MENU LABEL LarpOS Live (%ARCH%, BIOS, safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
